behaviors:
  ReachTarget:
    trainer_type: ppo
    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 60000
    
    hyperparameters:
      # Common Hyperparameters
      batch_size: 512
      buffer_size: 10240
      learning_rate: 0.0003
      learning_rate_schedule: linear
      
      # PPO-specific hyperparameters
      beta: 0.005
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    
    # Configuration of the neural network (common to PPO/SAC)
    network_settings:
      vis_encode_type: resnet
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

environment_parameters:
  # Lighting Randomization
  light_intensity:
    sampler_type: uniform
    sampler_parameters:
        min_value: 10
        max_value: 30
  light_px:
    sampler_type: uniform
    sampler_parameters:
        min_value: -3
        max_value: 3
  light_py:
    sampler_type: uniform
    sampler_parameters:
        min_value: 4
        max_value: 7
  light_pz:
    sampler_type: uniform
    sampler_parameters:
        min_value: -2
        max_value: 1.5

  # Target Randomization
  scale:
    sampler_type: uniform
    sampler_parameters:
        min_value: 0.05
        max_value: 0.12

  # Camera Randomization
  camera_px:
    sampler_type: uniform
    sampler_parameters:
        min_value: -0.2
        max_value: 0.2
  camera_py:
    sampler_type: uniform
    sampler_parameters:
        min_value: 4.8
        max_value: 5.2
  camera_pz:
    sampler_type: uniform
    sampler_parameters:
        min_value: -0.2
        max_value: 0.4
  camera_rx:
    sampler_type: uniform
    sampler_parameters:
        min_value: 87.0
        max_value: 93.0
  camera_ry:
    sampler_type: uniform
    sampler_parameters:
        min_value: -10.0
        max_value: 10.0

  # Color Randomization
  ground_r:
    sampler_type: uniform
    sampler_parameters:
        min_value: 0.0
        max_value: 0.4
  ground_g:
    sampler_type: uniform
    sampler_parameters:
        min_value: 0.6
        max_value: 0.8
  goal_r:
    sampler_type: uniform
    sampler_parameters:
        min_value: 0.5
        max_value: 1.0