behaviors:
  PushBlock:
    trainer_type: ppo
    keep_checkpoints: 5
    max_steps: 20000000
    time_horizon: 256
    summary_freq: 60000
    
    hyperparameters:
      # Common Hyperparameters
      batch_size: 256
      buffer_size: 10240
      learning_rate: 0.0001
      learning_rate_schedule: linear
      
      # PPO-specific hyperparameters
      beta: 0.005
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
    
    # Configuration of the neural network (common to PPO/SAC)
    network_settings:
      vis_encode_type: resnet
      normalize: true
      hidden_units: 256
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

environment_parameters:
  light_intensity:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: reward
          behavior: PushBlock
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 2.3
        value: 20
      - name: Lesson1
        completion_criteria:
          measure: reward
          behavior: PushBlock
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 2.3
        value:
          sampler_type: uniform
          sampler_parameters:
