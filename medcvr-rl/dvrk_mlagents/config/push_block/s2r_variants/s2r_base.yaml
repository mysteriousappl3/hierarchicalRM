# Notes:
# This variant has no randomization, and is used in real to determine the need for randomization
behaviors:
  S2RPushBlock:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      vis_encode_type: resnet
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail: # Disable this when continuing training with randomization
        gamma: 0.99
        strength: 0.01
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
        learning_rate: 0.0003
        use_actions: false
        use_vail: false
        demo_path: unity_project/Assets/Tasks/PushBlock/Demonstrations/s2r-pb-v0.demo
    max_steps: 4000000
    time_horizon: 128 # 128 seems like the correct horizon to complete a task
    summary_freq: 60000