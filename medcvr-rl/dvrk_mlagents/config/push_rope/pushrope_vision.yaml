behaviors:
  DVRKVisionPushRope:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2
      vis_encode_type: resnet
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.01
        network_settings:
          normalize: false
          hidden_units: 512
          num_layers: 2
          vis_encode_type: resnet
        learning_rate: 0.0003
        use_actions: false
        use_vail: false
        demo_path: unity_project/Assets/Demonstrations/dvrkvisionpushro_0.demo
    keep_checkpoints: 5
    max_steps: 4000000
    time_horizon: 64
    summary_freq: 60000
