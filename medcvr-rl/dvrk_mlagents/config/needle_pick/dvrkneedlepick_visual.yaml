behaviors:
  DVRKNeedlePickVision:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      vis_encode_type: resnet
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.01
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
        learning_rate: 0.0003
        use_actions: false
        use_vail: false
        demo_path: unity_project/Assets/Tasks/NeedlePick/Demonstrations/dvrkneedlepickvision.demo
    keep_checkpoints: 5
    max_steps: 4000000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  goal_offset:
    curriculum:
      - name: Lesson0 # This is the start of the second lesson
        completion_criteria:
          measure: reward
          behavior: DVRKNeedlePickVision
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 2
        value: 0.2
      - name: Lesson1
        completion_criteria:
          measure: reward
          behavior: DVRKNeedlePickVision
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 2.5
        value: 0.4
      - name: Lesson2
        completion_criteria:
          measure: reward
          behavior: DVRKNeedlePickVision
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 3.0
        value: 0.6
      - name: Lesson3
        completion_criteria:
          measure: reward
          behavior: DVRKNeedlePickVision
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 4.0
        value: 0.8
      - name: Lesson4
        value: 5.0