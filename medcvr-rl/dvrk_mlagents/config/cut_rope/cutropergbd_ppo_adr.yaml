behaviors:
  CutRope:
    trainer_type: ppo
    keep_checkpoints: 5
    max_steps: 40000000
    time_horizon: 128
    summary_freq: 60000

    hyperparameters:
      # Common Hyperparameters
      batch_size: 256 
      buffer_size: 10240
      learning_rate: 0.00015
      learning_rate_schedule: linear
      
      # PPO-specific hyperparameters
      beta: 0.005
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: constant
      lambd: 0.95
      num_epoch: 3
    
    # Configuration of the neural network (common to PPO/SAC)
    network_settings:
      vis_encode_type: resnet
      normalize: true
      hidden_units: 350
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

environment_parameters:
  light_intensity:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: reward
          behavior: CutRope
          signal_smoothing: true
          min_lesson_length: 300
          threshold: 4.5
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 18
            max_value: 22
      - name: Lesson1
        completion_criteria:
          measure: reward
          behavior: CutRope
