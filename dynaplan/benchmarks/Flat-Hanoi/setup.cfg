[metadata]
name = flat-hanoi
version = 0.1.0
description = Paper-derived Flat-to-Flat Tower of Hanoi benchmark
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
install_requires =

[options.package_data]
flat_hanoi =
    *.txt
    data/*.jsonl
    data/*.json
    data/*.md

[options.packages.find]
exclude =
    tests*

[options.entry_points]
console_scripts =
    flat-hanoi = flat_hanoi.cli:main
